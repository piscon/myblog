name: Translate content

# AI 翻译流水线：中文文章 → 日文/英文版（Cloudflare Workers AI 免费额度）。
# 逻辑在 scripts/translate.mjs（增量靠 front matter 的 source_hash，人工手写译文永不触碰）。
# 本 workflow 的 push 回写不会自我触发（paths 只看 content/zh/**），提交信息再带
# [skip-translate] 兜底 + [skip-lastmod] 省掉一次 update-lastmod（机翻文件不需要 lastmod）。

on:
  push:
    branches:
      - master
    paths:
      - 'content/zh/**/*.md'
  workflow_dispatch:
  schedule:
    # 周日 03:17 JST 全量对账：hash 扫描，干净时 0 次 API 调用；
    # 兜底修复漏网/抖动（openclaw/docs 模式）
    - cron: '17 18 * * 6'

concurrency:
  group: translate-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-translate]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive # 不带主题的话 hugo 构建门会跑在空壳站点上（无 layout 警告、页数骤减），校验形同虚设

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Translate zh content to ja/en
        id: translate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          AI_GATEWAY: blog-translate
        run: node scripts/translate.mjs

      - name: Install Hugo (same version as Netlify)
        run: |
          set -euo pipefail
          HUGO_VERSION=$(grep -oP 'HUGO_VERSION\s*=\s*"\K[^"]+' netlify.toml | head -1)
          echo "Hugo $HUGO_VERSION"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tgz
          tar -C /tmp -xzf /tmp/hugo.tgz hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Build check (guard against malformed generated content)
        run: hugo --gc --minify

      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # git add -A：翻译产物在 content/<lang>/posts/<name>.md，3 层深
          git add -A
          if git diff --cached --quiet; then
            echo "No translations to commit."
          else
            git commit -m "chore: AI translations (ja/en) [skip-translate] [skip-lastmod]"
            # update-lastmod 与本 workflow 都由 content 变更触发、都回写 git；
            # 推前 rebase 避免慢的一方被快的一方挡成 non-fast-forward
            git pull --rebase origin master
            git push
          fi

      - name: Fail run if any translation failed
        if: steps.translate.outputs.failures != '' && steps.translate.outputs.failures != '0'
        run: |
          echo "部分译文失败（${{ steps.translate.outputs.failures }} 项）：成功部分已提交上线，重跑本 workflow 可补齐（hash 命中不重复计费）"
          exit 1
