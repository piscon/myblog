name: Update lastmod (Pages CMS)

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-lastmod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse payload and update lastmod
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          
          echo "$PAYLOAD" > /tmp/payload.json
          
          # Extract context type and path
          CONTEXT_TYPE=$(jq -r '.context.type // empty' /tmp/payload.json)
          CONTEXT_PATH=$(jq -r '.context.path // empty' /tmp/payload.json)
          
          echo "Context type: $CONTEXT_TYPE"
          echo "Context path: $CONTEXT_PATH"
          
          # Decide which files to update
          if [ "$CONTEXT_TYPE" = "entry" ] && [ -n "$CONTEXT_PATH" ]; then
            FILES="$CONTEXT_PATH"
          else
            # Collection or root: update all content markdown files that have been touched recently
            FILES=$(find content -name '*.md' -type f)
          fi
          
          TODAY=$(date -u +%Y-%m-%d)
          UPDATED=0
          
          for file in $FILES; do
            [ -f "$file" ] || continue
            # Only process files under content/ and ending with .md
            case "$file" in
              content/*.md) ;;
              *) continue ;;
            esac
            
            echo "Processing $file"
            
            if grep -q '^lastmod' "$file"; then
              sed -i "s/^lastmod.*/lastmod = '$TODAY'/" "$file"
            else
              if grep -q '^date' "$file"; then
                sed -i "/^date/a lastmod = '$TODAY'" "$file"
              else
                sed -i "1a lastmod = '$TODAY'" "$file"
              fi
            fi
            UPDATED=$((UPDATED+1))
          done
          
          echo "Updated $UPDATED file(s)"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add content/**/*.md
            git commit -m "chore: update lastmod via Pages CMS [skip-lastmod]"
            git push
          fi
