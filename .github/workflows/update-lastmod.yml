name: Update lastmod

on:
  push:
    branches:
      - master
    paths:
      - 'content/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-lastmod:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-lastmod]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update lastmod in changed content files
        run: |
          set -euo pipefail
          
          # Get list of changed .md files in this push (content only).
          # Compare from github.event.before so multi-commit pushes are fully
          # covered (HEAD~1 only sees the last commit); fall back to HEAD~1
          # when before is unavailable (first push / force push).
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- 'content/**/*.md' || true)

          if [ -z "$CHANGED" ]; then
            echo "No content files changed."
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # while-read instead of a for loop: tolerates spaces in paths
          while IFS= read -r file; do
            # Skip if file no longer exists
            [ -f "$file" ] || continue
            
            # Get the author date of the latest commit that touched this file
            LAST_COMMIT_DATE=$(git log -1 --format=%aI -- "$file" || true)
            if [ -z "$LAST_COMMIT_DATE" ]; then
              continue
            fi
            
            # Convert to date only (YYYY-MM-DD) for front matter
            DATE_ONLY=$(date -u -d "$LAST_COMMIT_DATE" +%Y-%m-%d)
            
            echo "Updating $file -> lastmod = $DATE_ONLY"
            
            # Update or insert lastmod in TOML front matter.
            # Range 1,/^+++/ restricts edits to the front matter — article
            # bodies can contain TOML example code blocks with their own
            # `date =` lines (sed without the range once injected a lastmod
            # line into such a block).
            FM='1,/^+++[ \t]*$/'
            if sed -n "${FM}p" "$file" | grep -q '^lastmod'; then
              # Replace existing
              sed -i "${FM} s/^lastmod.*/lastmod = '$DATE_ONLY'/" "$file"
            elif sed -n "${FM}p" "$file" | grep -q '^date'; then
              # Insert after date line if present
              sed -i "${FM} {
                /^date/a lastmod = '$DATE_ONLY'
              }" "$file"
            else
              # Otherwise after first line of front matter (the opening +++)
              sed -i "1a lastmod = '$DATE_ONLY'" "$file"
            fi
          done <<< "$CHANGED"
          
          # Commit back if there are changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # git add -A: bash globs don't recurse (**), and content files live
          # at content/<lang>/posts/<name>.md — 3 levels deep
          git add -A
          if git diff --cached --quiet; then
            echo "No lastmod changes to commit."
          else
            git commit -m "chore: update lastmod from git [skip-lastmod]"
            # translate-content 与本 workflow 都由 content 变更触发、都回写 git；
            # 推前 rebase 避免慢的一方被快的一方挡成 non-fast-forward
            git pull --rebase origin master
            git push
          fi
