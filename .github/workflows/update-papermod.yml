name: Update PaperMod Submodule

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      payload:
        description: 'Pages CMS payload (JSON), optional'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PaperMod to latest
        id: update
        run: |
          set -euo pipefail
          cd themes/PaperMod
          git fetch origin master
          OLD=$(git rev-parse HEAD)
          git checkout master
          git pull origin master
          NEW=$(git rev-parse HEAD)
          cd ../..
          
          if [ "$OLD" = "$NEW" ]; then
            echo "No update available."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "Updated from $OLD to $NEW"
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "old_sha=$OLD" >> $GITHUB_OUTPUT
            echo "new_sha=$NEW" >> $GITHUB_OUTPUT
            
            # Collect recent commits for the PR body
            cd themes/PaperMod
            git log --oneline ${OLD}..${NEW} > /tmp/changelog.txt || true
            cd ../..
          fi

      - name: Install Hugo (version pinned in netlify.toml)
        if: steps.update.outputs.updated == 'true'
        run: |
          set -euo pipefail
          HUGO_VER=$(grep -oP 'HUGO_VERSION\s*=\s*"\K[^"]+' netlify.toml)
          echo "Installing Hugo extended $HUGO_VER"
          curl -sSL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VER}/hugo_extended_${HUGO_VER}_linux-amd64.tar.gz"
          mkdir -p /tmp/hugo-extract && tar -xzf /tmp/hugo.tar.gz -C /tmp/hugo-extract
          sudo install /tmp/hugo-extract/hugo /usr/local/bin/hugo
          hugo version

      - name: Check Hugo version meets theme minimum
        id: gate
        if: steps.update.outputs.updated == 'true'
        run: |
          set -euo pipefail
          MIN=$(grep -oP 'min_version\s*=\s*"\K[^"]+' themes/PaperMod/theme.toml)
          CUR=$(grep -oP 'HUGO_VERSION\s*=\s*"\K[^"]+' netlify.toml)
          echo "PaperMod min_version: $MIN | netlify.toml HUGO_VERSION: $CUR"
          LOWEST=$(printf '%s\n%s\n' "$MIN" "$CUR" | sort -V | head -1)
          if [ "$LOWEST" != "$MIN" ]; then
            echo "::error::PaperMod now requires Hugo >= $MIN but netlify.toml pins $CUR. Bump HUGO_VERSION before merging this update."
            exit 1
          fi

      - name: Verify site builds with updated theme
        id: build
        if: steps.update.outputs.updated == 'true'
        run: hugo --gc --minify

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update PaperMod submodule"
          branch: chore/update-papermod
          base: master
          title: "chore: update PaperMod submodule"
          body: |
            Automatic weekly update of the PaperMod theme submodule.
            
            **Old:** `${{ steps.update.outputs.old_sha }}`
            **New:** `${{ steps.update.outputs.new_sha }}`
            
            ### Changelog
            ```
            $(cat /tmp/changelog.txt 2>/dev/null || echo "No commit list available")
            ```
            
            Please review the frontend rendering before merging.
          delete-branch: true

      - name: Resolve merge mode
        id: mode
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          MODE="pr"
          if [ -n "$PAYLOAD" ]; then
            MODE=$(printf '%s' "$PAYLOAD" | jq -r '.inputs.merge_mode // "pr"')
          fi
          echo "Merge mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Auto-merge update PR
        if: steps.update.outputs.updated == 'true' && steps.mode.outputs.mode == 'auto'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge --squash --delete-branch chore/update-papermod
          echo "Update PR merged; Netlify will deploy automatically."

      - name: Write run summary
        if: always()
        env:
          UPDATED: ${{ steps.update.outputs.updated }}
          MODE: ${{ steps.mode.outputs.mode }}
          GATE: ${{ steps.gate.outcome }}
          BUILD: ${{ steps.build.outcome }}
          OLD_SHA: ${{ steps.update.outputs.old_sha }}
          NEW_SHA: ${{ steps.update.outputs.new_sha }}
        run: |
          SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "?")
          {
            if [ "$GATE" = "failure" ] || [ "$BUILD" = "failure" ]; then
              echo "## ❌ 有更新，但检查未通过"
              echo "- 通常是上游提高了 Hugo 最低版本要求。把 \`netlify.toml\` 的 \`HUGO_VERSION\` 抬到报错提示的版本后重试。"
              echo "- 本次目标版本：\`${NEW_SHA:-?}\`"
            elif [ "$UPDATED" = "true" ]; then
              if [ "$MODE" = "auto" ]; then
                echo "## 🚀 有更新，已自动合并上线"
                echo "- Netlify 正在自动部署，稍后刷新网站即可看到新版效果"
              else
                echo "## 🔄 有更新，PR 已创建等待合并"
                echo "- 前往 <https://github.com/piscon/myblog/pulls> 查看 changelog 并合并"
              fi
              echo "- 版本：\`${OLD_SHA}\` → \`${NEW_SHA}\`"
            elif [ "$UPDATED" = "false" ]; then
              echo "## ✅ 已是最新"
              echo "- 当前版本：\`${SHA}\`，上游 master 无新提交，无需任何操作"
            else
              echo "## ❌ 检查流程异常"
              echo "- 请查看上方失败步骤的日志"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
