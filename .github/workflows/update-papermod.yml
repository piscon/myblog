name: Update PaperMod Submodule

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PaperMod to latest
        id: update
        run: |
          set -euo pipefail
          cd themes/PaperMod
          git fetch origin master
          OLD=$(git rev-parse HEAD)
          git checkout master
          git pull origin master
          NEW=$(git rev-parse HEAD)
          cd ../..
          
          if [ "$OLD" = "$NEW" ]; then
            echo "No update available."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "Updated from $OLD to $NEW"
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "old_sha=$OLD" >> $GITHUB_OUTPUT
            echo "new_sha=$NEW" >> $GITHUB_OUTPUT
            
            # Collect recent commits for the PR body
            cd themes/PaperMod
            git log --oneline ${OLD}..${NEW} > /tmp/changelog.txt || true
            cd ../..
          fi

      - name: Install Hugo (version pinned in netlify.toml)
        if: steps.update.outputs.updated == 'true'
        run: |
          set -euo pipefail
          HUGO_VER=$(grep -oP 'HUGO_VERSION\s*=\s*"\K[^"]+' netlify.toml)
          echo "Installing Hugo extended $HUGO_VER"
          curl -sSL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VER}/hugo_extended_${HUGO_VER}_linux-amd64.tar.gz"
          mkdir -p /tmp/hugo-extract && tar -xzf /tmp/hugo.tar.gz -C /tmp/hugo-extract
          sudo install /tmp/hugo-extract/hugo /usr/local/bin/hugo
          hugo version

      - name: Check Hugo version meets theme minimum
        if: steps.update.outputs.updated == 'true'
        run: |
          set -euo pipefail
          MIN=$(grep -oP 'min_version\s*=\s*"\K[^"]+' themes/PaperMod/theme.toml)
          CUR=$(grep -oP 'HUGO_VERSION\s*=\s*"\K[^"]+' netlify.toml)
          echo "PaperMod min_version: $MIN | netlify.toml HUGO_VERSION: $CUR"
          LOWEST=$(printf '%s\n%s\n' "$MIN" "$CUR" | sort -V | head -1)
          if [ "$LOWEST" != "$MIN" ]; then
            echo "::error::PaperMod now requires Hugo >= $MIN but netlify.toml pins $CUR. Bump HUGO_VERSION before merging this update."
            exit 1
          fi

      - name: Verify site builds with updated theme
        if: steps.update.outputs.updated == 'true'
        run: hugo --gc --minify

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update PaperMod submodule"
          branch: chore/update-papermod
          base: master
          title: "chore: update PaperMod submodule"
          body: |
            Automatic weekly update of the PaperMod theme submodule.
            
            **Old:** `${{ steps.update.outputs.old_sha }}`
            **New:** `${{ steps.update.outputs.new_sha }}`
            
            ### Changelog
            ```
            $(cat /tmp/changelog.txt 2>/dev/null || echo "No commit list available")
            ```
            
            Please review the frontend rendering before merging.
          delete-branch: true
