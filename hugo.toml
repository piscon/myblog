baseURL = 'https://deux.top/'
title = '二重奏'
theme = 'PaperMod'
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true
timeZone = "Asia/Tokyo"
copyright = '© 2026 二重奏'

hasCJKLanguage = true
enableInlineShortcodes = false
enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true

[outputs]
home = ["HTML", "RSS", "JSON", "llms", "opensearch"]

# OpenSearch 描述文档（浏览器地址栏注册站内搜索）；?q= 由 site.js feature 14 回填
# （fastsearch 本身不读 URL）。per-language：三语言 home 各出一份 /{lang}/opensearch.xml
[outputFormats.opensearch]
  baseName = "opensearch"
  mediaType = "application/xml"

[outputFormats.llms]
baseName = "llms"
mediaType = "text/plain"
isPlainText = true

[pagination]
  pagerSize = 10

# 相关文章：Hugo 内建 Related Content，按 tags/categories 加权
[related]
  threshold = 80
  includeNewer = true
  toLower = true

[[related.indices]]
  name = "tags"
  weight = 60

[[related.indices]]
  name = "categories"
  weight = 40

# 站内搜索（Fuse.js）：标题命中优先于正文命中；threshold 沿用主题默认 0.4
[params.fuseOpts]
  ignoreLocation = true

[[params.fuseOpts.keys]]
  name = "title"
  weight = 2

[[params.fuseOpts.keys]]
  name = "summary"
  weight = 1.5

[[params.fuseOpts.keys]]
  name = "content"
  weight = 1

[[params.fuseOpts.keys]]
  name = "permalink"
  weight = 0.5

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[params]
  env = "production"
  # 归档/列表取文范围显式固定，不依赖 Hugo 的「最大 section」推断
  mainSections = ["posts"]
  # 评论开关；实际渲染由 [params.giscus] 是否填了凭据决定（见 comments.html）
  comments = true
  description = "精神与思想的二重奏，自由与独立的交响曲"
  author = "二重奏"
  # meta 行不显示作者（笔名全站恒定，页脚 © 已表达品牌）；head 的
  # <meta name="author"> 走 author.html，不受此参数影响，SEO 保留
  hideAuthor = true
  keywords = ["二重奏", "deux", "博客", "AI", "Hugo", "技术"]
  images = ["/branding/og-default.jpg"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  ShareButtons = ["x", "telegram"]
  # 列表/分类/标签/归档页标题旁的 RSS 订阅按钮（list.html 与归档覆盖版共同消费）
  ShowRssButtonInSectionTermList = true
  # RSS 全文输出（PaperMod rss.xml 的 content:encoded 开关；摘要仍在 description）
  ShowFullTextinRSS = true
  # 语言切换器与文章页翻译列表显示全名（简体中文/日本語/English），而非 Ja/En 缩写
  displayFullLangName = true
  showtoc = true
  tocopen = false
  disableScrollToTop = false

  [params.cover]
    hiddenInList = false
    hiddenInSingle = false

  [params.assets]
    # favicon 三层：.ico 兜底（部分抓取器/老浏览器）→ 16/32 PNG（gen-favicon.cjs
    # 从 favicon.svg 栅格化，透明底）→ apple-touch 180px PNG（iOS 不支持透明，
    # 压平到品牌暗底）；safari 走 SVG。单一事实源仍是 branding/ 一份 svg
    favicon = "/branding/favicon.ico"
    favicon16x16 = "/branding/favicon-16x16.png"
    favicon32x32 = "/branding/favicon-32x32.png"
    apple_touch_icon = "/branding/apple-touch-icon.png"
    safari_pinned_tab = "/branding/favicon.svg"
    # 浏览器 UI 兜底色（深底基线，与 dark 模式 --theme 背景一致）；
    # light/dark 按 prefers-color-scheme 的双 meta 由 extend_head 补发
    theme_color = "#16140f"

  [params.schema]
    publisherType = "Person"

  # 评论（giscus）：凭据经 GraphQL 查询取得（2026-11-05 启用，等效 giscus.app 的查询）；
  # 留空则评论区不渲染。仓库已开启 Discussions 并安装 giscus App
  [params.giscus]
    repo = "piscon/myblog"
    repoId = "R_kgDOM91SJw"
    category = "Announcements"
    categoryId = "DIC_kwDOM91SJ84DKauo"

  # 「在 GitHub 编辑」链接（公开仓库）；URL + 文件路径拼成具体文件链接
  # 分支必须与仓库默认分支一致（master）——此前写成 main 导致文章页链接 404
  # 2026-11-06 停用（meta 行减密）；重开时删掉 disabled 一行即可
  [params.editPost]
    URL = "https://github.com/piscon/myblog/blob/master"
    appendFilePath = true
    disabled = true

# 社交图标（2026-11-06 身份层）：首页 profileMode 下方渲染（social_icons partial 只读
# 全局 site.Params.socialIcons，页脚不渲染该 partial）。github 为真实账号；email 与 X
# 是占位模拟值——拿到真实地址后替换（about.md 三语内文有同样的占位注释）
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/piscon"
[[params.socialIcons]]
  name = "email"
  url = "mailto:hello@deux.top"
[[params.socialIcons]]
  name = "x"
  url = "https://x.com/deux_top"

[languages]
  [languages.zh]
    locale = "zh-CN"
    label = "简体中文"
    contentDir = "content/zh"
    weight = 1

    [languages.zh.params.profileMode]
      enabled = true
      title = "精神与思想的二重奏"
      subtitle = "自由与独立的交响曲"
      imageUrl = "branding/logo.gif"
      imageWidth = 120
      imageHeight = 120

    [[languages.zh.params.profileMode.buttons]]
      name = "最新文章"
      url = "/zh/posts/"
    [[languages.zh.params.profileMode.buttons]]
      name = "搜索"
      url = "/zh/search/"
    [[languages.zh.params.profileMode.buttons]]
      name = "归档"
      url = "/zh/archives/"
    # 社交图标已补回（2026-11-06 身份层）：全局 [[params.socialIcons]]（见 params 段），
    # 首页 profile 下方渲染；email 与 X 为占位——拿到真实地址后替换
    # 搜索已脱离菜单（2026-11-06）：头部语言切换器旁的独立图标（site.js 注入
    # .search-toggle，URL 数据源是 extend_head 发的 link rel=search）
    [[languages.zh.menu.main]]
      identifier = "posts"
      name = '文章'
      pageRef = '/posts'
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "about"
      name = '关于'
      pageRef = '/about'
      weight = 90
    [languages.zh.params.editPost]
      Text = '在 GitHub 上改进本文'
  [languages.ja]
    locale = "ja-JP"
    label = "日本語"
    contentDir = "content/ja"
    weight = 2
    title = "二重奏"

    [languages.ja.params]
    description = "精神と思考の二重奏、自由と独立の交響曲"
    keywords = ["二重奏", "deux", "ブログ", "AI", "Hugo"]

    [languages.ja.params.profileMode]
      enabled = true
      title = "精神と思考の二重奏"
      subtitle = "自由と独立の交響曲"
      imageUrl = "branding/logo.gif"
      imageWidth = 120
      imageHeight = 120

    [[languages.ja.params.profileMode.buttons]]
      name = "最新記事"
      url = "/ja/posts/"
    [[languages.ja.params.profileMode.buttons]]
      name = "検索"
      url = "/ja/search/"
    [[languages.ja.params.profileMode.buttons]]
      name = "アーカイブ"
      url = "/ja/archives/"
    [[languages.ja.menu.main]]
      identifier = "posts"
      name = '記事'
      pageRef = '/posts'
      weight = 10
    [[languages.ja.menu.main]]
      identifier = "about"
      name = 'About'
      pageRef = '/about'
      weight = 90
    [languages.ja.params.editPost]
      Text = 'GitHub で改善提案'
  [languages.en]
    locale = "en-US"
    label = "English"
    contentDir = "content/en"
    weight = 3
    title = "Deux"

    [languages.en.params]
    description = "A duet of spirit and thought, a symphony of freedom and independence"
    keywords = ["Deux", "blog", "AI", "Hugo"]

    [languages.en.params.profileMode]
      enabled = true
      title = "A duet of spirit and thought"
      subtitle = "a symphony of freedom and independence"
      imageUrl = "branding/logo.gif"
      imageWidth = 120
      imageHeight = 120

    [[languages.en.params.profileMode.buttons]]
      name = "Latest Posts"
      url = "/en/posts/"
    [[languages.en.params.profileMode.buttons]]
      name = "Search"
      url = "/en/search/"
    [[languages.en.params.profileMode.buttons]]
      name = "Archives"
      url = "/en/archives/"
    [[languages.en.menu.main]]
      identifier = "posts"
      name = 'Posts'
      pageRef = '/posts'
      weight = 10
    [[languages.en.menu.main]]
      identifier = "about"
      name = 'About'
      pageRef = '/about'
      weight = 90
    [languages.en.params.editPost]
      Text = 'Edit on GitHub'
# 把 static/images 追加挂载进 assets 文件系统：封面图单轨存放（CMS 上传/
# 正文引用都在 static/images），cover.html 的 resources 查找却能命中并做
# srcset 缩放——Hugo resources 只索引 assets/，无此挂载时 srcset 静默失效。
# 追加式挂载，默认 static/ → / 映射保留，品牌/favicon/音视频不受影响。
[module]
  # static/images 追加挂载进 assets 文件系统：封面图单轨存放（CMS 上传/正文
  # 引用都在 static/images），cover.html 的 resources 查找却能命中并做 srcset。
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[markup.highlight]
noClasses = false  # 亮暗双色: 类渲染让 chroma-dual.css 变量组接管(内联样式压过一切 CSS 必须关)
