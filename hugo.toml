baseURL = 'https://deux.top/'
title = '二重奏'
theme = 'PaperMod'
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true
timeZone = "Asia/Tokyo"
copyright = '© 2026 二重奏'

hasCJKLanguage = true
enableInlineShortcodes = false
enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true

[outputs]
home = ["HTML", "RSS", "JSON", "llms"]

[outputFormats.llms]
baseName = "llms"
mediaType = "text/plain"
isPlainText = true

[pagination]
  pagerSize = 8

# 相关文章：Hugo 内建 Related Content，按 tags/categories 加权
[related]
  threshold = 80
  includeNewer = true
  toLower = true

[[related.indices]]
  name = "tags"
  weight = 60

[[related.indices]]
  name = "categories"
  weight = 40

# 站内搜索（Fuse.js）：标题命中优先于正文命中；threshold 沿用主题默认 0.4
[params.fuseOpts]
  ignoreLocation = true

[[params.fuseOpts.keys]]
  name = "title"
  weight = 2

[[params.fuseOpts.keys]]
  name = "summary"
  weight = 1.5

[[params.fuseOpts.keys]]
  name = "content"
  weight = 1

[[params.fuseOpts.keys]]
  name = "permalink"
  weight = 0.5

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[params]
  env = "production"
  # 归档/列表取文范围显式固定，不依赖 Hugo 的「最大 section」推断
  mainSections = ["posts"]
  # 评论开关；实际渲染由 [params.giscus] 是否填了凭据决定（见 comments.html）
  comments = true
  description = "精神与思想的二重奏，自由与独立的交响曲"
  author = "二重奏"
  keywords = ["二重奏", "deux", "博客", "AI", "Hugo", "技术"]
  images = ["/branding/og-default.jpg"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  ShareButtons = ["x", "telegram"]
  # 列表/分类/标签/归档页标题旁的 RSS 订阅按钮（list.html 与归档覆盖版共同消费）
  ShowRssButtonInSectionTermList = true
  # RSS 全文输出（PaperMod rss.xml 的 content:encoded 开关；摘要仍在 description）
  ShowFullTextinRSS = true
  # 语言切换器与文章页翻译列表显示全名（简体中文/日本語/English），而非 Ja/En 缩写
  displayFullLangName = true
  showtoc = true
  tocopen = false
  disableScrollToTop = false

  [params.cover]
    hiddenInList = false
    hiddenInSingle = false

  [params.assets]
    favicon = "/branding/favicon.ico"
    favicon16x16 = "/branding/favicon.ico"
    favicon32x32 = "/branding/favicon.ico"
    apple_touch_icon = "/branding/favicon.ico"
    safari_pinned_tab = "/branding/favicon.svg"
    # 浏览器 UI 兜底色（深底基线，与 dark 模式 --theme 背景一致）；
    # light/dark 按 prefers-color-scheme 的双 meta 由 extend_head 补发
    theme_color = "#1d1e20"

  [params.schema]
    publisherType = "Person"

  # 评论（giscus）：凭据经 GraphQL 查询取得（2026-11-05 启用，等效 giscus.app 的查询）；
  # 留空则评论区不渲染。仓库已开启 Discussions 并安装 giscus App
  [params.giscus]
    repo = "piscon/myblog"
    repoId = "R_kgDOM91SJw"
    category = "Announcements"
    categoryId = "DIC_kwDOM91SJ84DKauo"

  # 「在 GitHub 编辑」链接（公开仓库）；URL + 文件路径拼成具体文件链接
  # 分支必须与仓库默认分支一致（master）——此前写成 main 导致文章页链接 404
  [params.editPost]
    URL = "https://github.com/piscon/myblog/blob/master"
    appendFilePath = true

[languages]
  [languages.zh]
    locale = "zh-CN"
    label = "简体中文"
    contentDir = "content/zh"
    weight = 1

    [languages.zh.params.profileMode]
      enabled = true
      title = "精神与思想的二重奏"
      subtitle = "自由与独立的交响曲"
      imageUrl = "branding/logo.gif"
      imageWidth = 120
      imageHeight = 120

    [[languages.zh.params.profileMode.buttons]]
      name = "最新文章"
      url = "/zh/posts/"
    [[languages.zh.params.profileMode.buttons]]
      name = "搜索"
      url = "/zh/search/"
    [[languages.zh.params.profileMode.buttons]]
      name = "归档"
      url = "/zh/archives/"
    # 社交图标占位死链已删（曾指向平台首页）；拿到真实主页后在 profileMode.socialIcons 加回
    [[languages.zh.menu.main]]
      identifier = "posts"
      name = '文章'
      pageRef = '/posts'
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "archives"
      name = '归档'
      pageRef = '/archives'
      weight = 40
    [[languages.zh.menu.main]]
      identifier = "search"
      name = '搜索'
      pageRef = '/search'
      weight = 70
