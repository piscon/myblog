baseURL = 'https://deux.top/'
title = '二重奏'
theme = 'PaperMod'
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true
timeZone = "Asia/Tokyo"

hasCJKLanguage = true
enableInlineShortcodes = false
enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true

[outputs]
home = ["HTML", "RSS", "JSON", "llms"]

[outputFormats.llms]
baseName = "llms"
mediaType = "text/plain"
isPlainText = true

[pagination]
  pagerSize = 8

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[params]
  env = "production"
  # 归档/列表取文范围显式固定，不依赖 Hugo 的「最大 section」推断
  mainSections = ["posts"]
  # 评论开关；实际渲染由 [params.giscus] 是否填了凭据决定（见 comments.html）
  comments = true
  description = "精神与思想的二重奏，自由与独立的交响曲"
  author = "二重奏"
  keywords = ["二重奏", "deux", "博客", "AI", "Hugo", "技术"]
  images = ["/branding/logo.jpg"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  showtoc = true
  tocopen = false
  disableScrollToTop = false

  [params.cover]
    hiddenInList = false
    hiddenInSingle = false

  [params.assets]
    favicon = "/branding/favicon.ico"
    favicon16x16 = "/branding/favicon.ico"
    favicon32x32 = "/branding/favicon.ico"
    apple_touch_icon = "/branding/favicon.ico"
    safari_pinned_tab = "/branding/favicon.svg"

  [params.schema]
    publisherType = "Person"

  # 评论（giscus）：到 giscus.app 选好仓库/分类后，把四个值填入即启用；
  # 留空则评论区不渲染。仓库需开启 Discussions 并安装 giscus App
  [params.giscus]
    repo = ""
    repoId = ""
    category = ""
    categoryId = ""

[languages]
  [languages.zh]
    locale = "zh-CN"
    label = "简体中文"
    contentDir = "content/zh"
    weight = 1

    [languages.zh.params.profileMode]
      enabled = true
      title = "精神与思想的二重奏"
      subtitle = "自由与独立的交响曲"
      imageUrl = "branding/logo.gif"
      imageWidth = 120
      imageHeight = 120

    [[languages.zh.params.profileMode.buttons]]
      name = "最新文章"
      url = "/zh/posts/"
    [[languages.zh.params.profileMode.buttons]]
      name = "搜索"
      url = "/zh/search/"
    [[languages.zh.params.profileMode.buttons]]
      name = "归档"
      url = "/zh/archives/"
    [[languages.zh.params.socialIcons]]
      name = "youtube"
      url = "https://youtube.com/"
    [[languages.zh.params.socialIcons]]
      name = "twitter"
      url = "https://twitter.com/"
    [[languages.zh.params.socialIcons]]
      name = "github"
      url = "https://github.com/"

    [[languages.zh.menu.main]]
      identifier = "posts"
      name = '文章'
      pageRef = '/posts'
      weight = 10
