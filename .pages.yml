# Pages CMS 配置
#
# 三集合的 fields/filename/view 经 YAML 锚点共享（zh 块定义 &post_*，ja/en 引用）：
# 增改字段只动 zh 块一处、三语言同步生效；代价是字段 label/description 统一为中文
# （2026-11-05 定案，站点主编辑语言为中文）。
# ⚠️ 勿在 CMS Settings UI 里重存本文件——重新序列化会展开锚点、文件膨胀回三份。
#
# media.rename: safe 会 slugify 上传文件名（默认保留原名）；CJK 文件名的 slugify
# 行为未验证，若实测中文名被剥光（只剩扩展名/互相重名），把 rename 改回 false。
#
# 视频不进 git（Netlify 配额约定）：video 媒体源与 video_file 字段已移出 CMS；
# 模板仍消费 video_file/video_url（Git 路径维护），merge: true 保住已有文章的键。
# files 附件媒体源已删（2026-11-06）：static/files 目录不存在、无任何字段消费，
# 纯死配置——将来要附件功能时从 git 历史恢复这一块即可。

media:
  - name: images
    label: 图片
    input: static/images
    output: /images
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe
  - name: audio
    label: 音频
    input: static/audio
    output: /audio
    categories: [audio]
    rename: safe

content:
  - name: zh-posts
    label: 中文文章
    type: collection
    path: content/zh/posts
    format: toml-frontmatter
    exclude: [_index.md]
    fields: &post-fields
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要（SEO）
        type: string
        description: 70-160字，用于搜索摘要和分享预览；搜索结果约展示前 80 字（中日文），首句必须承载重点；单行
        pattern:
          regex: '^(.{70,160})?$'
          message: 摘要建议 70-160 字（首句放重点），留空则不生成摘要
      - name: date
        label: 日期
        type: date
        required: true
      - name: draft
        label: 草稿
        type: boolean
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: cover
        label: 封面
        component: cover
      - name: audio_file
        label: 音频（文末播放器）
        type: file
        options:
          media: audio
          categories: [audio]
      - name: media_position
        label: 播放器位置
        type: select
        options:
          values:
            - name: bottom
              label: 文末（默认）
            - name: top
              label: 置顶（标题下方）
      - name: youtube_id
        label: YouTube 视频 ID
        type: string
        description: 只贴视频 ID（如 dQw4w9WgXcQ），不是完整链接；大陆读者无法加载 YouTube
        pattern:
          regex: '^([A-Za-z0-9_-]{11})?$'
          message: YouTube ID 为 11 位字符（字母数字_-），请只贴 ID 不贴链接
      - name: bilibili_bvid
        label: B 站 BV 号
        type: string
        description: 只贴 BV 号（如 BV1xx411c7mD），不是完整链接
        pattern:
          regex: '^(BV[0-9A-Za-z]{10})?$'
          message: B 站 BV 号以 BV 开头共 12 位，请只贴 BV 号不贴链接
      - name: weight
        label: 置顶权重
        type: number
        description: 数字越小排序越靠前，用于置顶文章；留空按日期排序
        options:
          min: 0
      - name: searchHidden
        label: 从站内搜索隐藏
        type: boolean
      - name: robotsNoIndex
        label: 禁止搜索引擎收录
        type: boolean
        description: 开启后输出 noindex meta，搜索引擎不收录本页
      - name: no_translate
        label: 不翻译（退出 AI 日/英文自动生成）
        type: boolean
        description: 仅中文条目勾选：本篇不再生成/更新日文英文版（已有译文保留不动）
      - name: translation_lock
        label: 锁定译文（校对后转人工稿）
        type: boolean
        description: 仅 ja/en 译文条目勾选：此译文视同人工稿件，AI 永不覆盖/删除，中文原文更新也不再同步
      - name: aliases
        label: 旧链接跳转
        type: string
        list: true
        description: 改过文件名的文章填旧路径（不含语言前缀，如 /posts/20261104-1551/，系统自动按语言落地），旧链接自动跳转到本文
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          media: images
    filename: &post-filename
      template: '{year}{month}{day}-{hour}{minute}.md'
      field: create
    view: &post-view
      fields: [title, description, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

  - name: ja-posts
    label: 日本語記事
    type: collection
    path: content/ja/posts
    format: toml-frontmatter
    exclude: [_index.md]
    fields: *post-fields
    filename: *post-filename
    view: *post-view

  - name: en-posts
    label: English Posts
    type: collection
    path: content/en/posts
    format: toml-frontmatter
    exclude: [_index.md]
    fields: *post-fields
    filename: *post-filename
    view: *post-view

  # 关于页三语：type file 挂单页文件（fields 同样锚点共享）。正文保持普通 Markdown
  # （Tiptap 不保证 HTML 注释/shortcode 保真——占位联系方式提醒写在 body 字段 description，
  # 不写 HTML 注释）。operations 全关：单页文件不可新建/改名/删除，防误删整页 404。
  - name: zh-about
    label: 关于页（中文）
    type: file
    path: content/zh/about.md
    format: toml-frontmatter
    fields: &about-fields
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要（SEO）
        type: string
      - name: body
        label: 正文
        type: rich-text
        required: true
        description: 联系方式一节里 email 与 X 为占位模拟值（GitHub 真实），拿到真实地址后在此替换
        options:
          media: images
    operations: &about-ops
      create: false
      rename: false
      delete: false

  - name: ja-about
    label: 关于页（日本語）
    type: file
    path: content/ja/about.md
    format: toml-frontmatter
    fields: *about-fields
    operations: *about-ops

  - name: en-about
    label: 关于页（English）
    type: file
    path: content/en/about.md
    format: toml-frontmatter
    fields: *about-fields
    operations: *about-ops

components:
  cover:
    label: 通用封面
    type: object
    fields:
      - name: image
        label: 封面图
        type: image
        path: static/images
      - name: caption
        label: 图片说明
        type: string
      - name: alt
        label: 图片替代文本
        type: string

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: 'CMS create {filename}'
      update: 'CMS update {filename}'
      delete: 'CMS delete {filename}'
      rename: 'CMS rename {oldFilename} -> {newFilename}'
