media:
  - name: images
    label: 图片
    input: static/images
    output: /images
    extensions: [jpg, jpeg, png, webp, gif, svg]
  - name: files
    label: 附件
    input: static/files
    output: /files
    categories: [document]

content:
  - name: zh-posts
    label: 中文文章
    type: collection
    path: content/zh/posts
    format: toml-frontmatter
    fields:
      - name: lang
        label: 语言
        type: string
        default: zh
        required: true
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要（SEO）
        type: text
        description: 120-160字，用于搜索摘要和分享预览
      - name: date
        label: 日期
        type: date
        required: true
      - name: draft
        label: 草稿
        type: boolean
        default: false
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: cover
        label: 封面
        type: object
        fields:
          - name: image
            label: 封面图
            type: image
            path: static/images
          - name: caption
            label: 图片说明
            type: string
          - name: alt
            label: 图片替代文本
            type: string
      - name: body
        label: 正文
        type: rich-text # 💡 这里已由 markdown 改为 rich-text
        required: true
    filename: '{slug}.md'
    view:
      fields: [title, description, date, draft, lang]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      filter:
        draft: false

  - name: ja-posts
    label: 日本語記事
    type: collection
    path: content/ja/posts
    format: toml-frontmatter
    fields:
      - name: lang
        label: 言語
        type: string
        default: ja
        required: true
      - name: title
        label: タイトル
        type: string
        required: true
      - name: description
        label: 概要（SEO）
        type: text
        description: 120-160文字、検索概要と共有プレビュー用
      - name: date
        label: 日付
        type: date
        required: true
      - name: draft
        label: 下書き
        type: boolean
        default: false
      - name: categories
        label: カテゴリ
        type: string
        list: true
      - name: tags
        label: タグ
        type: string
        list: true
      - name: cover
        label: カバー
        type: object
        fields:
          - name: image
            label: カバー画像
            type: image
            path: static/images
          - name: caption
            label: キャプション
            type: string
          - name: alt
            label: 代替テキスト
            type: string
      - name: body
        label: 本文
        type: rich-text # 💡 这里已由 markdown 改为 rich-text
        required: true
    filename: '{slug}.md'
    view:
      fields: [title, description, date, draft, lang]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      filter:
        draft: false

  - name: en-posts
    label: English Posts
    type: collection
    path: content/en/posts
    format: toml-frontmatter
    fields:
      - name: lang
        label: Language
        type: string
        default: en
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description (SEO)
        type: text
        description: 120-160 characters for search snippets and share previews
      - name: date
        label: Date
        type: date
        required: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: categories
        label: Categories
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: cover
        label: Cover
        type: object
        fields:
          - name: image
            label: Cover image
            type: image
            path: static/images
          - name: caption
            label: Caption
            type: string
          - name: alt
            label: Alt text
            type: string
      - name: body
        label: Body
        type: rich-text # 💡 这里已由 markdown 改为 rich-text
        required: true
    filename: '{slug}.md'
    view:
      fields: [title, description, date, draft, lang]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      filter:
        draft: false

components:
  cover:
    label: 通用封面
    type: object
    fields:
      - name: image
        label: 封面图
        type: image
        path: static/images
      - name: caption
        label: 图片说明
        type: string
      - name: alt
        label: 图片替代文本
        type: string

settings:
  content:
    merge: true
  i18n:
    locale: auto

actions:
  - name: check-papermod-update
    label: 检查主题更新
    workflow: update-papermod.yml
    cancelable: false
    confirm:
      title: 检查 PaperMod 更新？
      message: 将拉取上游 master 对比当前版本。若有更新，先做版本门槛和构建检查，再按下方选择的方式处理。
      button: 开始检查
    fields:
      - name: merge_mode
        label: 发现更新后
        type: select
        required: true
        default: pr
        options:
          - label: 开 PR，由我在 GitHub 合并
            value: pr
          - label: 自动合并并部署上线
            value: auto
