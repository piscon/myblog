[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.169.0"
  HUGO_ENV = "production"
  TZ = "Asia/Tokyo"

# 默认策略：HTML / RSS / sitemap / JSON 等页面内容 —— 每次都向 CDN 回源校验，
# 部署后访客立即拿到新内容（配合 ETag，未变更时只产生 304）
# 安全基线（2026-11-04）：nosniff / 禁 iframe 嵌套 / 来源策略 / HSTS 一年。
# CSP 因主题与站点层大量 inline style/script 暂不上；HSTS 未含 includeSubDomains
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"

# 带内容指纹的主题资源（stylesheet.<hash>.css / search.<hash>.js）——
# 文件名即版本，内容变更时 URL 必变，可永久缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 站点 JS（site.min.<hash>.js）发布在 /js/ 而非 /assets/js/（resources.Get
# 路径直出），同样内容寻址，同享 immutable
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 静态图片（无指纹）：长缓存但非 immutable；换图时改文件名或加 ?v=N 参数即可
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate"

# 自托管字体切片（static/fonts/v1/）：文件名无内容哈希，版本化目录即
# 缓存键——升级字体时把 v1 改名 v2 并同步 fonts.css 里的 URL（AGENTS.md 字体栈约定）
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 品牌资产（favicon/logo）：几乎不变，长缓存
[[headers]]
  for = "/branding/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate"

# llms.txt 仅按语言生成（/zh|ja|en/llms.txt），根路径转发到中文版
[[redirects]]
  from = "/llms.txt"
  to = "/zh/llms.txt"
  status = 301

# 404 按语言前缀分流（无真实文件命中时才触发）
[[redirects]]
  from = "/ja/*"
  to = "/ja/404.html"
  status = 404

[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/zh/404.html"
  status = 404