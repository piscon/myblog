<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 阴鱼主体（纯黑底圆，半径64，完全贴合 128x128 边缘） -->
  <circle cx="64" cy="64" r="64" fill="#000000" />

  <!-- 阳鱼主体（纯白 S 型半边） -->
  <path fill="#FFFFFF" d="M 64 0 A 64 64 0 0 1 64 128 A 32 32 0 0 0 64 64 A 32 32 0 0 1 64 0 Z" />

  <!-- 阳鱼眼点（白鱼头部内的纯黑圆点） -->
  <circle cx="64" cy="32" r="10" fill="#000000" />

  <!-- 阴鱼眼点（黑鱼头部内的纯白圆点） -->
  <circle cx="64" cy="96" r="10" fill="#FFFFFF" />
</svg>